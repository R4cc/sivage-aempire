name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build jar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check Rust formatting
        working-directory: src/main/rust
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src/main/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: src/main/rust
        run: cargo test

      - name: Build imaging WASM
        working-directory: src/main/rust
        run: cargo build --target wasm32-unknown-unknown --release --lib

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Determine build version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="${BASE_VERSION}-main.${GITHUB_RUN_NUMBER}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=aempire-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test jar
        run: ./gradlew build "-Pmod_version=${{ steps.version.outputs.version }}"

      - name: Collect jar
        shell: bash
        run: |
          mkdir -p dist
          cp "build/libs/sivage-${{ steps.version.outputs.version }}.jar" "dist/sivage-aempire-${{ steps.version.outputs.version }}.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sivage-aempire-${{ steps.version.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish main snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sivage-aempire-${{ needs.build.outputs.version }}
          path: dist

      - name: Create immutable prerelease snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            "dist/sivage-aempire-${{ needs.build.outputs.version }}.jar" \
            --title "sivage-aempire ${{ needs.build.outputs.version }}" \
            --notes "Automated main snapshot for commit ${{ github.sha }}" \
            --prerelease
